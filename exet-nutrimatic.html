<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nutrimatic results</title>
<!--
  Same-origin restyler for nutrimatic.org results embedded in Exet.
  Fetches via /api/nutrimatic (see nutrimatic-proxy.js) when available;
  otherwise falls back to a zoomed nutrimatic iframe.
-->
<style>
  :root {
    --xet-nutri-fg: #222;
    --xet-nutri-muted: #666;
    --xet-nutri-link: #0645ad;
    --xet-nutri-border: #ddd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    color: var(--xet-nutri-fg);
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 13px;
    line-height: 1.35;
    background: #fff;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 6px 8px 10px;
  }
  form.xet-nutri-form {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--xet-nutri-border);
  }
  form.xet-nutri-form input[type="search"] {
    flex: 1 1 12em;
    min-width: 8em;
    font: inherit;
    font-size: 12px;
    padding: 3px 6px;
  }
  form.xet-nutri-form input[type="submit"],
  form.xet-nutri-form button {
    font: inherit;
    font-size: 12px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .xet-nutri-status {
    color: var(--xet-nutri-muted);
    font-size: 11px;
    font-style: italic;
    margin: 0 0 6px;
  }
  .xet-nutri-status.xet-nutri-error {
    color: #b00020;
    font-style: normal;
  }
  .xet-nutri-status a {
    color: var(--xet-nutri-link);
  }
  .xet-nutri-main {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
  }
  ul.xet-nutri-results {
    list-style: disc;
    margin: 0;
    padding: 0 0 0 1.25em;
  }
  ul.xet-nutri-results li {
    margin: 0.15em 0;
    padding: 0;
    line-height: 1.3;
  }
  .xet-nutri-footer {
    margin-top: 10px;
    font-size: 12px;
  }
  .xet-nutri-footer a {
    color: var(--xet-nutri-link);
  }
  iframe.xet-nutri-fallback {
    flex: 1 1 auto;
    width: 166.67%;
    height: 166.67%;
    border: 0;
    transform: scale(0.6);
    transform-origin: top left;
  }
  .xet-nutri-fallback-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .xet-nutri-open {
    font-size: 11px;
    margin: 0 0 6px;
  }
  .xet-nutri-open a {
    color: var(--xet-nutri-link);
  }
</style>
</head>
<body>
  <form class="xet-nutri-form" id="xet-nutri-form" action="" method="get">
    <input type="search" name="q" id="xet-nutri-q" size="45"
      autocomplete="off" autocorrect="off" autocapitalize="off"
      spellcheck="false" title="Nutrimatic query (editable)">
    <input type="submit" value="Go">
    <button type="button" id="xet-nutri-reload" title="Reload results">Reload</button>
  </form>
  <div class="xet-nutri-open" id="xet-nutri-open"></div>
  <div class="xet-nutri-status" id="xet-nutri-status">Loading…</div>
  <div class="xet-nutri-main" id="xet-nutri-main"></div>

<script>
(function() {
  const NUTRIMATIC_BASE = 'https://nutrimatic.org/2024/';
  const PROXY_PATH = '/api/nutrimatic';
  const params = new URLSearchParams(window.location.search);
  const qInput = document.getElementById('xet-nutri-q');
  const statusElt = document.getElementById('xet-nutri-status');
  const mainElt = document.getElementById('xet-nutri-main');
  const openElt = document.getElementById('xet-nutri-open');
  const form = document.getElementById('xet-nutri-form');

  qInput.value = params.get('q') || '';

  function nutriUrlFromParams(searchParams) {
    const u = new URL(NUTRIMATIC_BASE);
    for (const [k, v] of searchParams.entries()) {
      u.searchParams.set(k, v);
    }
    return u.href;
  }

  function currentNutriUrl() {
    return nutriUrlFromParams(new URLSearchParams(window.location.search));
  }

  function setOpenLink(url) {
    openElt.innerHTML =
      '<a href="' + escapeAttr(url) + '" target="_blank" rel="noopener">' +
      'Open on nutrimatic.org</a>';
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, '&#39;');
  }

  /**
   * Map Nutrimatic's large em font-sizes into a compact readable range.
   * Ranking is preserved lightly (higher score => slightly larger type).
   */
  function emToPx(em) {
    const t = Math.min(1, Math.max(0, (Number(em) - 0.4) / 3.2));
    return (11 + t * 3.5).toFixed(1) + 'px';
  }

  function rewriteNutriHref(href) {
    if (!href) return href;
    try {
      const abs = new URL(href, NUTRIMATIC_BASE);
      if (!/(^|\.)nutrimatic\.org$/i.test(abs.hostname)) {
        return href;
      }
      const local = new URL(window.location.href);
      local.search = abs.search;
      return local.pathname + local.search + local.hash;
    } catch (e) {
      return href;
    }
  }

  function renderFromHtml(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const results = [];
    const spans = doc.querySelectorAll('span[style*="font-size"]');
    for (const span of spans) {
      const text = (span.textContent || '').trim();
      if (!text) continue;
      const m = (span.getAttribute('style') || '')
          .match(/font-size\s*:\s*([\d.]+)\s*em/i);
      results.push({
        text: text,
        em: m ? parseFloat(m[1]) : 1,
      });
    }

    let footerHtml = '';
    const paragraphs = doc.querySelectorAll('body > p');
    for (const p of paragraphs) {
      const clone = p.cloneNode(true);
      clone.querySelectorAll('a[href]').forEach(a => {
        a.setAttribute('href', rewriteNutriHref(a.getAttribute('href')));
      });
      footerHtml += '<div class="xet-nutri-footer">' + clone.innerHTML + '</div>';
    }

    // Also catch bare status text not wrapped as expected.
    if (!footerHtml) {
      const bodyText = (doc.body && doc.body.innerHTML) || '';
      if (/Computation limit reached|No more results|No results found/i
          .test(bodyText) && results.length === 0) {
        footerHtml = '<div class="xet-nutri-footer">' + bodyText + '</div>';
      }
    }

    mainElt.innerHTML = '';
    if (results.length === 0 && !footerHtml) {
      statusElt.className = 'xet-nutri-status';
      statusElt.textContent = 'No results to display.';
      return;
    }

    statusElt.className = 'xet-nutri-status';
    statusElt.textContent = results.length ?
        (results.length + ' result' + (results.length === 1 ? '' : 's')) : '';

    if (results.length) {
      const ul = document.createElement('ul');
      ul.className = 'xet-nutri-results';
      for (const r of results) {
        const li = document.createElement('li');
        li.style.fontSize = emToPx(r.em);
        li.textContent = r.text;
        ul.appendChild(li);
      }
      mainElt.appendChild(ul);
    }
    if (footerHtml) {
      const footer = document.createElement('div');
      footer.innerHTML = footerHtml;
      mainElt.appendChild(footer);
    }
  }

  function showFallbackIframe(url) {
    statusElt.className = 'xet-nutri-status';
    statusElt.innerHTML =
      'Showing nutrimatic.org directly (scaled down). ' +
      'Run <code>node nutrimatic-proxy.js</code> with Exet for a ' +
      'compact bulleted list.';
    mainElt.className = 'xet-nutri-fallback-wrap';
    mainElt.innerHTML =
      '<iframe class="xet-nutri-fallback" title="Nutrimatic" src="' +
      escapeAttr(url) + '"></iframe>';
  }

  async function fetchViaProxy(qs) {
    const r = await fetch(PROXY_PATH + '?' + qs, {
      credentials: 'same-origin',
      headers: { 'Accept': 'text/html' },
    });
    if (!r.ok) {
      throw new Error('Proxy HTTP ' + r.status);
    }
    return r.text();
  }

  async function loadResults() {
    const qs = window.location.search.startsWith('?') ?
        window.location.search.slice(1) : window.location.search;
    const url = currentNutriUrl();
    setOpenLink(url);

    if (!qInput.value) {
      statusElt.className = 'xet-nutri-status';
      statusElt.textContent = 'Enter a query and press Go.';
      mainElt.innerHTML = '';
      return;
    }

    statusElt.className = 'xet-nutri-status';
    statusElt.textContent = 'Loading…';
    mainElt.className = 'xet-nutri-main';
    mainElt.innerHTML = '';

    try {
      const html = await fetchViaProxy(qs || ('q=' + encodeURIComponent(qInput.value)));
      renderFromHtml(html);
    } catch (e) {
      showFallbackIframe(url);
    }
  }

  form.addEventListener('submit', function(ev) {
    ev.preventDefault();
    const next = new URL(window.location.href);
    next.searchParams.set('q', qInput.value);
    // Fresh search: drop pagination / computation overrides unless kept in form.
    if (!form.querySelector('[name="comp"]')) {
      next.searchParams.delete('comp');
    }
    next.searchParams.delete('start');
    window.location.search = next.search;
  });

  document.getElementById('xet-nutri-reload').addEventListener('click', function() {
    loadResults();
  });

  // Carry through non-q params (comp, start, num) as hidden fields on submit
  // by keeping them in the URL; form only edits q.
  for (const key of ['comp', 'start', 'num']) {
    if (params.has(key)) {
      const hidden = document.createElement('input');
      hidden.type = 'hidden';
      hidden.name = key;
      hidden.value = params.get(key);
      form.appendChild(hidden);
    }
  }

  loadResults();
})();
</script>
</body>
</html>
